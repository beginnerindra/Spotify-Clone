<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up - Spotify</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-page">

        <div class="signup-container">

            <!-- Spotify Logo -->
            <div class="spotify-logo">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="12" fill="white" />

                    <path d="M6.2 9.1C10.1 7.9 14.7 8.2 18 9.5" fill="none" stroke="#121212" stroke-width="1.5"
                        stroke-linecap="round" />

                    <path d="M6.8 12.1C10.2 11.1 14 11.3 17.1 12.5" fill="none" stroke="#121212" stroke-width="1.5"
                        stroke-linecap="round" />

                    <path d="M7.6 14.8C10.3 14.1 13.3 14.3 15.8 15.2" fill="none" stroke="#121212" stroke-width="1.5"
                        stroke-linecap="round" />
                </svg>
            </div>


            <!-- Heading -->
            <h1>
                Sign up to<br>
                start listening
            </h1>


            <!-- Email Form -->
            <form>

                <label for="email">
                    Email address
                </label>

                <input type="email" id="email" placeholder="name@domain.com">

                <button type="submit" class="next-button">
                    Next
                </button>

            </form>


            <!-- OR -->
            <div class="or">
                <span>or</span>
            </div>


            <!-- Phone -->
            <button class="social-button">
                <span class="button-icon phone-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="6" y="2" width="12" height="20" rx="2" fill="none" stroke="white" stroke-width="2" />
                        <circle cx="12" cy="18" r="1" fill="white" />
                    </svg>
                </span>
                <span>Sign up with phone number</span>
            </button>

            <!-- Google -->
            <button class="social-button">
                <span class="button-icon google-icon">G</span>
                <span>Sign up with Google</span>
            </button>

            <!-- Apple -->
            <button id="apple-icon" class="social-button">
                <img src="apple-solid-white.svg" alt="">
                <span>Sign up with Apple</span>
            </button>

            <!-- Login -->
            <div class="login-section">
                <p>Already have an account?</p>
                <a href="login.html">Log in</a>
            </div>

        </div>

    </div>

</body>

</html>
